# Decap CMS 后台配置
# 详细文档：https://decapcms.org/docs/

backend:
  name: github
  repo: cranenf/cranenf.github.io
  branch: main
  # ⚠️ 请把下面这行替换成你自己的 OAuth 网关地址（部署指引见聊天），否则无法登录后台
  base_url: https://YOUR-OAUTH-GATEWAY.vercel.app

# 上传图片在仓库里的存储目录（相对仓库根目录）
media_folder: "src/content/posts/images"
# 上传后插入到文章里的相对路径
public_folder: "images"

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "published", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "描述", name: "description", widget: "text", required: false }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "category", widget: "string", required: false }
      - { label: "置顶", name: "pinned", widget: "boolean", required: false, default: false }
      - { label: "允许评论", name: "comment", widget: "boolean", required: false, default: true }
      - { label: "草稿", name: "draft", widget: "boolean", required: false, default: false }
      - { label: "正文", name: "body", widget: "markdown" }
